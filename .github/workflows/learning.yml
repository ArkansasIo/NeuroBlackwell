name: NeuroBlackwell Learning Benchmark
on:
  push:
  pull_request:
jobs:
  learning-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r learning/requirements.txt
      - run: PYTHONPATH=. pytest -q learning/tests
      - run: python learning/tools/generate_curriculum_workbook.py
